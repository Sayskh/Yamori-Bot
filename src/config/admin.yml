# Konfigurasi Teks Admin & Grup
# File ini otomatis di-reload (tidak perlu restart bot)

welcome_template: |
  Halo @user! Selamat datang di grup @group.
  Diharapkan untuk mematuhi peraturan grup ya.

goodbye_template: |
  Selamat tinggal @user dari grup @group.
  Semoga harimu menyenangkan!

promote_template: |
  Selamat! @user sekarang telah diangkat menjadi Admin grup.

demote_template: |
  Mohon maaf, @user telah diturunkan menjadi member biasa.

kick_template: |
  Telah berhasil mengeluarkan @user dari grup.

lock_template: "Grup dikunci. Hanya admin yang bisa mengirim pesan."
unlock_template: "Grup dibuka. Semua member bisa mengirim pesan."

groupinfo_template: |
  *[ @groupName ]*

  @desc

  Member: @totalMembers
  Admin: @adminCount

  @adminList

  Pesan: @announce
  Ubah Info: @restrict

  Dibuat: @creationDate
